<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Редактор сцен</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #1a1a1f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e8e8e8;
    font-size: 12px;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    width: 100%;
  }

  .toolbar {
    background: #2a2a32;
    padding: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    border-bottom: 1px solid #3a3a44;
    font-size: 12px;
    flex-shrink: 0;
  }
  .toolbar button, .toolbar select, .toolbar input[type=color] {
    background: #3a3a44;
    color: #e8e8e8;
    border: 1px solid #4a4a55;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .toolbar button.active { background: #6a5acd; border-color: #8a7aed; }
  .toolbar button:active { transform: scale(0.95); }
  .toolbar input[type=color] { padding: 2px; width: 34px; height: 30px; }
  .toolbar .group { display: flex; gap: 2px; align-items: center; }

  #canvasWrap {
    flex: 1 1 0;
    min-height: 0;
    position: relative;
    background: #0d0d10;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  #phone {
    position: relative;
    width: min(88vw, 380px);
    height: min(72vh, 640px);
    max-height: 100%;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    border-radius: 6px;
    flex-shrink: 0;
  }
  #sceneCanvas, #drawCanvas, #effectLayer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #sceneCanvas { z-index: 1; }
  #drawCanvas { z-index: 2; touch-action: none; }
  #effectLayer { z-index: 3; pointer-events: none; }

  #bgDesc {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 86%;
    text-align: center;
    color: rgba(40,40,40,0.22);
    font-size: 12px;
    font-style: italic;
    font-weight: 400;
    pointer-events: none;
    z-index: 4;
    white-space: pre-wrap;
    line-height: 1.3;
    display: none;
  }
  #bgDesc.visible { display: block; }

  #phrasesLayer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }
  .phrase {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    text-align: center;
    font-weight: 600;
    transition: opacity 0.7s ease, bottom 0.7s ease, font-size 0.7s ease, color 0.7s ease;
    white-space: pre-wrap;
    line-height: 1.25;
  }
  .phrase.slot-0 { opacity: 1; bottom: 14%; }
  .phrase.slot-1 { opacity: 0.35; bottom: 30%; }
  .phrase.slot-2 { opacity: 0; bottom: 42%; }

  #choicesLayer {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }
  .choiceBtn {
    position: absolute;
    pointer-events: auto;
    border: 2px solid #222;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    transition: transform 0.1s;
    text-align: center;
    min-width: 80px;
    max-width: 80%;
  }
  .choiceBtn:active { transform: translateX(-50%) scale(0.96); }
  .choiceBtn .editDot {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 18px;
    height: 18px;
    background: #6a5acd;
    color: #fff;
    border-radius: 50%;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #fff;
  }
  #phone.playing .choiceBtn .editDot { display: none; }

  #btnPlayScene {
    position: absolute;
    z-index: 7;
    right: 8px;
    bottom: 8px;
    background: #6a5acd;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #btnPlayScene:active { transform: scale(0.92); }

  #phone.playing #drawCanvas { pointer-events: none; }
  #phone.playing #btnPlayScene { display: none; }
  #phone.playing #btnStopPlay { display: flex; }
  #btnStopPlay {
    position: absolute;
    z-index: 8;
    right: 8px;
    top: 8px;
    background: #c0504d;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }

  .bottomBar {
    background: #2a2a32;
    padding: 6px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    border-top: 1px solid #3a3a44;
    font-size: 11px;
    flex-shrink: 0;
  }
  .bottomBar button {
    background: #3a3a44;
    color: #e8e8e8;
    border: 1px solid #4a4a55;
    border-radius: 6px;
    padding: 8px 4px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bottomBar button:active { transform: scale(0.96); }
  .bottomBar button.primary { background: #6a5acd; border-color: #8a7aed; }

  #homeScreen {
    position: fixed;
    inset: 0;
    background: #1a1a1f;
    z-index: 100;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  #homeScreen.hidden { display: none; }
  #homeScreen h1 { font-size: 17px; margin-bottom: 10px; color: #b8a8ff; }
  #homeScreen h2 {
    font-size: 12px; margin: 14px 0 8px; color: #a8a8b8;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .homeActions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .homeActions button {
    background: #3a3a44; color: #fff; border: none; border-radius: 8px;
    padding: 10px 8px; font-size: 12px; cursor: pointer;
  }
  .homeActions button.primary { background: #6a5acd; }
  .homeActions button:active { transform: scale(0.97); }

  .sceneCard {
    background: #2a2a32;
    border: 1px solid #3a3a44;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sceneCard .thumb {
    width: 40px; height: 54px; background: #fff; border-radius: 5px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #999; overflow: hidden;
  }
  .sceneCard .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sceneCard .info { flex: 1; min-width: 0; }
  .sceneCard .info .title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sceneCard .info .meta { font-size: 10px; color: #888; margin-top: 2px; }
  .sceneCard .actions { display: flex; gap: 3px; flex-shrink: 0; }
  .sceneCard .actions button {
    background: #3a3a44; color: #e8e8e8; border: 1px solid #4a4a55;
    border-radius: 5px; padding: 5px 7px; font-size: 11px; cursor: pointer;
  }
  .sceneCard .actions button:active { transform: scale(0.95); }
  .sceneCard .actions .del { background: #6a3030; }
  .sceneCard .actions .edit { background: #4a6a30; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
  .modal.hidden { display: none; }
  .modal .box {
    background: #2a2a32; border-radius: 12px; padding: 12px;
    width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto;
  }
  .modal .box h3 { font-size: 14px; margin-bottom: 10px; color: #b8a8ff; }
  .modal .box label { display: block; font-size: 11px; color: #a8a8b8; margin: 8px 0 3px; }
  .modal .box input, .modal .box select, .modal .box textarea {
    width: 100%; background: #1a1a22; color: #e8e8e8;
    border: 1px solid #4a4a55; border-radius: 6px; padding: 7px;
    font-size: 12px; font-family: inherit;
  }
  .modal .box textarea { min-height: 50px; resize: vertical; }
  .modal .box input[type=color] { width: 100%; height: 34px; padding: 2px; }
  .modal .box input[type=range] { padding: 0; }
  .modal .box .row { display: flex; gap: 5px; margin-top: 10px; }
  .modal .box .row button {
    flex: 1; padding: 9px; border: none; border-radius: 7px;
    font-size: 12px; cursor: pointer; background: #3a3a44; color: #e8e8e8;
  }
  .modal .box .row button.ok { background: #6a5acd; }
  .modal .box .row button:active { transform: scale(0.97); }
  .modal .box .posGrid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;
  }
  .modal .box .posGrid label { margin: 0; }
  .modal .box .sizeRow {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .modal .box .sizeRow label { margin: 0; }

  .hidden { display: none !important; }

  #effectLayer.fade-dark { animation: fadeDark var(--dur, 3s) forwards; }
  #effectLayer.blink { animation: blinkEffect var(--dur, 3s) infinite; }
  @keyframes fadeDark { from { background: transparent; } to { background: rgba(0,0,0,0.95); } }
  @keyframes blinkEffect {
    0%, 100% { background: transparent; }
    50% { background: rgba(0,0,0,0.9); }
  }
</style>
</head>
<body>
<div id="app">

  <div class="toolbar" id="drawToolbar">
    <button id="btnBackHome">🏠</button>
    <div class="group">
      <button class="tool" data-tool="brush" id="toolBrush">✏️</button>
      <button class="tool" data-tool="eraser" id="toolEraser">🧽</button>
      <button class="tool" data-tool="fill" id="toolFill">🪣</button>
      <button class="tool" data-tool="rect" id="toolRect">▭</button>
      <button class="tool" data-tool="circle" id="toolCircle">◯</button>
      <button class="tool" data-tool="line" id="toolLine">╱</button>
    </div>
    <input type="color" id="colorPick" value="#222222" title="Цвет">
    <select id="sizePick">
      <option value="2">2px</option>
      <option value="5">5px</option>
      <option value="10" selected>10px</option>
      <option value="20">20px</option>
      <option value="40">40px</option>
      <option value="80">80px</option>
    </select>
    <button id="btnUndo">↶</button>
    <button id="btnClearDraw">🗑</button>
    <button id="btnImageBg">🖼</button>
  </div>

  <div id="canvasWrap">
    <div id="phone">
      <canvas id="sceneCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <div id="effectLayer"></div>
      <div id="bgDesc"></div>
      <div id="phrasesLayer"></div>
      <div id="choicesLayer"></div>
      <button id="btnPlayScene" title="Начать сцену">▶</button>
      <button id="btnStopPlay" title="Остановить">⏹</button>
    </div>
  </div>

  <div class="bottomBar" id="bottomBar">
    <button id="btnAddPhrase">＋ Фраза</button>
    <button id="btnAddChoice">＋ Выбор</button>
    <button id="btnAddNext">＋ Далее</button>
    <button id="btnEffects">✨ Эффекты</button>
    <button id="btnBgDesc">🖼 Описание</button>
    <button id="btnTexts">📝 Тексты</button>
    <button id="btnSave" class="primary">💾 Сохр.</button>
    <button id="btnAllButtons">⚙️ Все кнопки</button>
  </div>
</div>

<div id="homeScreen">
  <h1>📖 Черновик игры</h1>
  <div class="homeActions">
    <button class="primary" onclick="newScene(null)">＋ Новая сцена</button>
    <button onclick="exportAll()">💾 Экспорт</button>
    <button onclick="document.getElementById('importFile').click()">📂 Импорт</button>
    <button onclick="if(confirm('Удалить ВСЕ сцены?')){state.scenes=[];state.currentId=null;save();renderSceneList();}">🗑 Всё</button>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importAll(event)">
  </div>
  <h2>Все сцены</h2>
  <div id="sceneList"></div>
</div>

<!-- МОДАЛКА ФРАЗЫ -->
<div class="modal hidden" id="phraseModal">
  <div class="box">
    <h3>Фраза</h3>
    <label>Текст</label>
    <textarea id="phraseText" placeholder="Введите фразу..."></textarea>

    <label>Цвет</label>
    <input type="color" id="phraseColor" value="#1a1a1a">

    <div style="font-size:11px;color:#b8a8ff;margin-top:12px;margin-bottom:4px;">ПЕРЕДНИЙ ПЛАН (текущая фраза)</div>
    <div class="sizeRow">
      <div>
        <label>Размер шрифта (px)</label>
        <input type="number" id="phraseSizeFront" value="22" min="8" max="80">
      </div>
      <div>
        <label>Шрифт</label>
        <select id="phraseFontFront">
          <option value="system-ui, sans-serif">Sans-serif</option>
          <option value="Georgia, serif">Serif</option>
          <option value="'Courier New', monospace">Monospace</option>
          <option value="'Comic Sans MS', cursive">Cursive</option>
          <option value="'Brush Script MT', cursive">Рукописный</option>
          <option value="Impact, sans-serif">Impact</option>
          <option value="'Times New Roman', serif">Times</option>
          <option value="Verdana, sans-serif">Verdana</option>
        </select>
      </div>
    </div>

    <div style="font-size:11px;color:#b8a8ff;margin-top:12px;margin-bottom:4px;">ЗАДНИЙ ПЛАН (предыдущая фраза)</div>
    <div class="sizeRow">
      <div>
        <label>Размер шрифта (px)</label>
        <input type="number" id="phraseSizeBack" value="16" min="8" max="80">
      </div>
      <div>
        <label>Шрифт</label>
        <select id="phraseFontBack">
          <option value="system-ui, sans-serif">Sans-serif</option>
          <option value="Georgia, serif">Serif</option>
          <option value="'Courier New', monospace">Monospace</option>
          <option value="'Comic Sans MS', cursive">Cursive</option>
          <option value="'Brush Script MT', cursive">Рукописный</option>
          <option value="Impact, sans-serif">Impact</option>
          <option value="'Times New Roman', serif">Times</option>
          <option value="Verdana, sans-serif">Verdana</option>
        </select>
      </div>
    </div>

    <label style="margin-top:12px;">Длительность показа (сек), 0 = держать</label>
    <input type="number" id="phraseDur" value="0" min="0">

    <label>Аудио</label>
    <div class="row">
      <button id="btnRecAudio">🎙 Запись</button>
      <button id="btnStopRec" class="hidden">⏹ Стоп</button>
      <button id="btnLoadAudio">📁 Файл</button>
      <input type="file" id="audioFile" accept="audio/*" class="hidden">
    </div>
    <div id="audioStatus" style="font-size:10px;color:#888;margin-top:4px;"></div>
    <div class="row">
      <button onclick="closeModal('phraseModal')">Отмена</button>
      <button class="ok" onclick="savePhrase()">Готово</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА КНОПКИ -->
<div class="modal hidden" id="choiceModal">
  <div class="box">
    <h3 id="choiceModalTitle">Кнопка</h3>
    <label>Надпись на кнопке</label>
    <input type="text" id="choiceLabel" placeholder="Например: Пойти налево">
    <label>Заливка</label>
    <input type="color" id="choiceBg" value="#ffffff">
    <label>Цвет текста</label>
    <input type="color" id="choiceText" value="#1a1a1a">
    <label>Цвет рамки</label>
    <input type="color" id="choiceBorder" value="#222222">
    <label>Куда ведёт</label>
    <select id="choiceTarget">
      <option value="new">— Новая пустая сцена —</option>
    </select>
    <label>Позиция X (слева, %)</label>
    <input type="range" id="choiceX" min="0" max="100" value="50">
    <div id="choiceXVal" style="font-size:10px;color:#888;">50%</div>
    <label>Позиция Y (снизу, %)</label>
    <input type="range" id="choiceY" min="0" max="100" value="20">
    <div id="choiceYVal" style="font-size:10px;color:#888;">20%</div>
    <div class="row">
      <button onclick="closeModal('choiceModal')">Отмена</button>
      <button class="ok" onclick="saveChoice()">Готово</button>
    </div>
    <div class="row" id="choiceDeleteRow" style="display:none;">
      <button onclick="deleteEditingChoice()" style="background:#6a3030;">Удалить кнопку</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ЭФФЕКТОВ -->
<div class="modal hidden" id="effectModal">
  <div class="box">
    <h3>Эффекты листа</h3>
    <label>Тип эффекта</label>
    <select id="effectType">
      <option value="none">Нет</option>
      <option value="fade-dark">Постепенное затемнение</option>
      <option value="blink">Моргание</option>
    </select>
    <label>Длительность (сек)</label>
    <input type="number" id="effectDur" value="3" min="1" max="30">
    <div class="row">
      <button onclick="closeModal('effectModal')">Отмена</button>
      <button class="ok" onclick="saveEffect()">Готово</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ОПИСАНИЯ ФОНА -->
<div class="modal hidden" id="bgDescModal">
  <div class="box">
    <h3>Описание фона</h3>
    <label>Что изображено на фоне (тусклая надпись)</label>
    <textarea id="bgDescText" placeholder="Например: Тёмный лес, туман, силуэты деревьев..."></textarea>
    <label>Размер шрифта (px)</label>
    <input type="number" id="bgDescSize" value="12" min="8" max="30">
    <div class="row">
      <button onclick="closeModal('bgDescModal')">Отмена</button>
      <button class="ok" onclick="saveBgDesc()">Готово</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ВСЕХ КНОПОК -->
<div class="modal hidden" id="allButtonsModal">
  <div class="box">
    <h3>Все кнопки на листе</h3>
    <div id="allButtonsList"></div>
    <div class="row">
      <button onclick="closeModal('allButtonsModal')">Закрыть</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ТЕКСТОВ -->
<div class="modal hidden" id="textsModal">
  <div class="box">
    <h3>Фразы на листе</h3>
    <div id="textsList"></div>
    <div class="row">
      <button onclick="closeModal('textsModal')">Закрыть</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   МОДЕЛЬ
   ============================================================ */
const STORAGE_KEY = 'game_draft_v5';
let state = { scenes: [], currentId: null };

function uid() { return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function newScene(parentId) {
  const s = {
    id: uid(),
    title: 'Сцена ' + (state.scenes.length + 1),
    phrases: [],
    choices: [],
    effect: { type: 'none', dur: 3 },
    drawing: null,
    bgImage: null,
    bgColor: '#ffffff',
    bgDesc: '',
    bgDescSize: 12,
    parentId: parentId || null,
  };
  state.scenes.push(s);
  save();
  renderSceneList();
  return s;
}

function findScene(id) { return state.scenes.find(s => s.id === id); }

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { console.warn('save error', e); }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.scenes = d.scenes || [];
      state.currentId = d.currentId;
    }
  } catch(e) { console.warn(e); }
}

function escapeHtml(t) {
  return String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   ГЛАВНЫЙ ЭКРАН
   ============================================================ */
function renderSceneList() {
  const list = document.getElementById('sceneList');
  list.innerHTML = '';
  if (state.scenes.length === 0) {
    list.innerHTML = '<p style="color:#666;font-size:12px;">Пока нет сцен. Создайте первую.</p>';
    return;
  }
  state.scenes.forEach(s => {
    const card = document.createElement('div');
    card.className = 'sceneCard';
    const thumb = s.bgImage
      ? `<img src="${s.bgImage}">`
      : (s.drawing ? `<img src="${s.drawing}">` : '📄');
    card.innerHTML = `
      <div class="thumb">${thumb}</div>
      <div class="info">
        <div class="title">${escapeHtml(s.title)}</div>
        <div class="meta">${s.phrases.length} фраз · ${s.choices.length} кнопок ${s.parentId ? '· 🌿' : '· 🏠'}</div>
      </div>
      <div class="actions">
        <button class="edit" data-act="edit" data-id="${s.id}">✏️</button>
        <button data-act="copy" data-id="${s.id}">⧉</button>
        <button class="del" data-act="del" data-id="${s.id}">🗑</button>
      </div>
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      if (b.dataset.act === 'edit') openScene(id);
      if (b.dataset.act === 'copy') copyScene(id);
      if (b.dataset.act === 'del') deleteScene(id);
    };
  });
}

function copyScene(id) {
  const src = findScene(id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.title = src.title + ' (копия)';
  copy.phrases = copy.phrases.map(p => ({...p, id: uid()}));
  copy.choices = copy.choices.map(c => ({...c, id: uid(), targetId: null}));
  state.scenes.push(copy);
  save();
  renderSceneList();
}

function deleteScene(id) {
  if (!confirm('Удалить сцену?')) return;
  state.scenes = state.scenes.filter(s => s.id !== id);
  state.scenes.forEach(s => {
    s.choices = s.choices.filter(c => c.targetId !== id);
    if (s.parentId === id) s.parentId = null;
  });
  save();
  renderSceneList();
}

/* ============================================================
   ОТКРЫТИЕ СЦЕНЫ
   ============================================================ */
let ctxScene, ctxDraw;
let currentScene = null;
let drawHistory = [];
let currentTool = 'brush';
let isDrawing = false;
let startPoint = null;
let lastPoint = null;
let playing = false;
let playTimers = [];

function openScene(id) {
  const s = findScene(id);
  if (!s) return;
  state.currentId = id;
  currentScene = s;
  stopPlaying();
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('drawToolbar').classList.remove('hidden');
  document.getElementById('bottomBar').classList.remove('hidden');
  document.getElementById('canvasWrap').classList.remove('hidden');

  const phone = document.getElementById('phone');
  const sceneCv = document.getElementById('sceneCanvas');
  const drawCv = document.getElementById('drawCanvas');
  const rect = phone.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  [sceneCv, drawCv].forEach(cv => {
    cv.width = Math.max(1, Math.floor(rect.width * dpr));
    cv.height = Math.max(1, Math.floor(rect.height * dpr));
    cv.style.width = rect.width + 'px';
    cv.style.height = rect.height + 'px';
  });

  ctxScene = sceneCv.getContext('2d');
  ctxDraw = drawCv.getContext('2d');
  ctxScene.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctxDraw.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawHistory = [];
  if (s.drawing) {
    const img = new Image();
    img.onload = () => {
      ctxDraw.clearRect(0, 0, rect.width, rect.height);
      ctxDraw.drawImage(img, 0, 0, rect.width, rect.height);
      pushHistory();
    };
    img.src = s.drawing;
  } else {
    pushHistory();
  }

  renderSceneBackground();
  renderBgDesc();
  renderPhrases();
  renderChoices();
  applyEffect();
  updateToolUI();
  save();
}

/* ============================================================
   ФОН И ОПИСАНИЕ
   ============================================================ */
function renderSceneBackground() {
  if (!currentScene || !ctxScene) return;
  const cv = document.getElementById('sceneCanvas');
  const w = cv.width / (window.devicePixelRatio || 1);
  const h = cv.height / (window.devicePixelRatio || 1);
  ctxScene.clearRect(0, 0, w, h);
  ctxScene.fillStyle = currentScene.bgColor || '#fff';
  ctxScene.fillRect(0, 0, w, h);
  if (currentScene.bgImage) {
    const img = new Image();
    img.onload = () => ctxScene.drawImage(img, 0, 0, w, h);
    img.src = currentScene.bgImage;
  }
}

function renderBgDesc() {
  const el = document.getElementById('bgDesc');
  if (!currentScene || !currentScene.bgDesc) {
    el.classList.remove('visible');
    el.textContent = '';
    return;
  }
  el.textContent = currentScene.bgDesc;
  el.style.fontSize = (currentScene.bgDescSize || 12) + 'px';
  el.classList.add('visible');
}

function openBgDescModal() {
  if (!currentScene) return;
  document.getElementById('bgDescText').value = currentScene.bgDesc || '';
  document.getElementById('bgDescSize').value = currentScene.bgDescSize || 12;
  document.getElementById('bgDescModal').classList.remove('hidden');
}

function saveBgDesc() {
  if (!currentScene) return;
  currentScene.bgDesc = document.getElementById('bgDescText').value;
  currentScene.bgDescSize = parseInt(document.getElementById('bgDescSize').value) || 12;
  closeModal('bgDescModal');
  renderBgDesc();
  save();
}

/* ============================================================
   РИСОВАНИЕ
   ============================================================ */
const drawCv = document.getElementById('drawCanvas');

function pushHistory() {
  if (!ctxDraw) return;
  try { drawHistory.push(drawCv.toDataURL()); } catch(e) {}
  if (drawHistory.length > 20) drawHistory.shift();
}

function restoreFromHistory() {
  const data = drawHistory[drawHistory.length - 1];
  if (!data) return;
  const img = new Image();
  img.onload = () => {
    const w = drawCv.width / (window.devicePixelRatio || 1);
    const h = drawCv.height / (window.devicePixelRatio || 1);
    ctxDraw.clearRect(0, 0, w, h);
    ctxDraw.drawImage(img, 0, 0, w, h);
    applyStrokeStyle();
  };
  img.src = data;
}

function getPos(e) {
  const r = drawCv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function startDraw(e) {
  if (!currentScene || playing) return;
  e.preventDefault();
  const p = getPos(e);
  isDrawing = true;
  startPoint = p;
  lastPoint = p;

  if (currentTool === 'fill') {
    floodFill(p);
    isDrawing = false;
    pushHistory();
    if (currentScene) { currentScene.drawing = drawCv.toDataURL(); save(); }
    return;
  }
  applyStrokeStyle();
  if (currentTool === 'brush' || currentTool === 'eraser') {
    ctxDraw.beginPath();
    ctxDraw.moveTo(p.x, p.y);
    ctxDraw.lineTo(p.x + 0.01, p.y + 0.01);
    ctxDraw.stroke();
  }
}

function moveDraw(e) {
  if (!isDrawing || !currentScene || playing) return;
  e.preventDefault();
  const p = getPos(e);

  if (currentTool === 'brush' || currentTool === 'eraser') {
    ctxDraw.lineTo(p.x, p.y);
    ctxDraw.stroke();
    lastPoint = p;
  } else if (currentTool === 'rect' || currentTool === 'circle' || currentTool === 'line') {
    restoreFromHistory();
    applyStrokeStyle();
    drawShape(currentTool, startPoint, p);
    lastPoint = p;
  }
}

function drawShape(tool, a, b) {
  if (tool === 'rect') {
    ctxDraw.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
  } else if (tool === 'circle') {
    const r = Math.hypot(b.x - a.x, b.y - a.y);
    ctxDraw.beginPath();
    ctxDraw.arc(a.x, a.y, r, 0, Math.PI * 2);
    ctxDraw.stroke();
  } else if (tool === 'line') {
    ctxDraw.beginPath();
    ctxDraw.moveTo(a.x, a.y);
    ctxDraw.lineTo(b.x, b.y);
    ctxDraw.stroke();
  }
}

function endDraw() {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentTool === 'rect' || currentTool === 'circle' || currentTool === 'line') {
    const p = lastPoint || startPoint;
    restoreFromHistory();
    applyStrokeStyle();
    drawShape(currentTool, startPoint, p);
  }
  pushHistory();
  if (currentScene) {
    currentScene.drawing = drawCv.toDataURL();
    save();
  }
}

function applyStrokeStyle() {
  const color = document.getElementById('colorPick').value;
  const size = parseInt(document.getElementById('sizePick').value);
  ctxDraw.strokeStyle = color;
  ctxDraw.lineWidth = size;
  ctxDraw.lineCap = 'round';
  ctxDraw.lineJoin = 'round';
  ctxDraw.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
}

function floodFill(p) {
  const cv = drawCv;
  const dpr = window.devicePixelRatio || 1;
  const x = Math.floor(p.x * dpr);
  const y = Math.floor(p.y * dpr);
  const w = cv.width, h = cv.height;
  if (x < 0 || y < 0 || x >= w || y >= h) return;
  const imgData = ctxDraw.getImageData(0, 0, w, h);
  const data = imgData.data;
  const idx = (y * w + x) * 4;
  const target = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
  const hex = document.getElementById('colorPick').value;
  const fr = parseInt(hex.slice(1,3),16);
  const fg = parseInt(hex.slice(3,5),16);
  const fb = parseInt(hex.slice(5,7),16);
  if (target[0]===fr && target[1]===fg && target[2]===fb && target[3]===255) return;
  const stack = [[x,y]];
  const seen = new Uint8Array(w*h);
  const tol = 30;
  function match(i) {
    return Math.abs(data[i]-target[0])<tol && Math.abs(data[i+1]-target[1])<tol &&
           Math.abs(data[i+2]-target[2])<tol && Math.abs(data[i+3]-target[3])<tol;
  }
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx<0||cy<0||cx>=w||cy>=h) continue;
    const pi = cy*w + cx;
    if (seen[pi]) continue;
    const di = pi*4;
    if (!match(di)) continue;
    seen[pi] = 1;
    data[di]=fr; data[di+1]=fg; data[di+2]=fb; data[di+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctxDraw.putImageData(imgData, 0, 0);
}

/* ============================================================
   ФРАЗЫ — 2 слота (текущая + предыдущая)
   ============================================================ */
function renderPhrases() {
  const layer = document.getElementById('phrasesLayer');
  layer.innerHTML = '';
  if (!currentScene) return;
  currentScene.phrases.forEach(ph => {
    const div = document.createElement('div');
    div.className = 'phrase';
    div.dataset.id = ph.id;
    div.textContent = ph.text;
    div.style.color = ph.color || '#1a1a1a';
    layer.appendChild(div);
  });
  updatePhraseSlots(currentScene.phrases.length);
}

/* Всего 2 видимых слота: 0 = текущая (передний план), 1 = предыдущая (задний план).
   Фраза на слоте 2 исчезает. У каждой фразы свои размеры и шрифты для переднего и заднего плана. */
function updatePhraseSlots(visibleCount) {
  const els = Array.from(document.querySelectorAll('#phrasesLayer .phrase'));
  const n = visibleCount;
  els.forEach((el, i) => {
    el.classList.remove('slot-0', 'slot-1', 'slot-2');
    const fromEnd = n - 1 - i;
    const ph = currentScene.phrases[i];
    if (fromEnd === 0) {
      el.classList.add('slot-0');
      el.style.fontSize = (ph.sizeFront || 22) + 'px';
      el.style.fontFamily = ph.fontFront || 'system-ui, sans-serif';
    } else if (fromEnd === 1) {
      el.classList.add('slot-1');
      el.style.fontSize = (ph.sizeBack || 16) + 'px';
      el.style.fontFamily = ph.fontBack || 'system-ui, sans-serif';
    } else {
      el.classList.add('slot-2');
      el.style.fontSize = (ph.sizeBack || 16) + 'px';
      el.style.fontFamily = ph.fontBack || 'system-ui, sans-serif';
    }
  });
}

/* ============================================================
   КНОПКИ / ВЫБОРЫ / ДАЛЕЕ
   ============================================================ */
let editingChoiceId = null;
let editingChoiceKind = 'choice';

function renderChoices() {
  const layer = document.getElementById('choicesLayer');
  layer.innerHTML = '';
  if (!currentScene) return;
  currentScene.choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choiceBtn';
    btn.dataset.id = ch.id;
    btn.style.left = (ch.x ?? 50) + '%';
    btn.style.bottom = (ch.y ?? 20) + '%';
    btn.style.transform = 'translateX(-50%)';
    btn.style.background = ch.bg || '#ffffff';
    btn.style.color = ch.textColor || '#1a1a1a';
    btn.style.borderColor = ch.borderColor || '#222222';

    const span = document.createElement('span');
    span.textContent = ch.label;
    btn.appendChild(span);

    if (!playing) {
      const dot = document.createElement('span');
      dot.className = 'editDot';
      dot.textContent = '✏️';
      btn.appendChild(dot);
    }

    btn.onclick = (e) => {
      e.stopPropagation();
      if (playing) {
        if (ch.targetId) {
          const t = findScene(ch.targetId);
          if (t) { openScene(t.id); startPlaying(); }
          else alert('Сцена не найдена');
        } else {
          const ns = newScene(currentScene.id);
          ch.targetId = ns.id;
          save();
          openScene(ns.id);
          startPlaying();
        }
      } else {
        openChoiceModal(ch.id);
      }
    };
    layer.appendChild(btn);
  });
}

function openChoiceModal(editId, kind) {
  if (!currentScene) return;
  editingChoiceId = editId || null;
  editingChoiceKind = kind || 'choice';
  const modal = document.getElementById('choiceModal');
  modal.classList.remove('hidden');
  const title = document.getElementById('choiceModalTitle');
  title.textContent = editingChoiceKind === 'next' ? 'Кнопка «Далее»' : 'Кнопка выбора';

  const sel = document.getElementById('choiceTarget');
  sel.innerHTML = '<option value="new">— Новая пустая сцена —</option>';
  state.scenes.forEach(s => {
    if (s.id !== currentScene.id) {
      const o = document.createElement('option');
      o.value = s.id;
      o.textContent = s.title;
      sel.appendChild(o);
    }
  });

  document.getElementById('choiceDeleteRow').style.display = editId ? 'flex' : 'none';

  if (editId) {
    const ch = currentScene.choices.find(c => c.id === editId);
    if (ch) {
      document.getElementById('choiceLabel').value = ch.label;
      document.getElementById('choiceBg').value = ch.bg || '#ffffff';
      document.getElementById('choiceText').value = ch.textColor || '#1a1a1a';
      document.getElementById('choiceBorder').value = ch.borderColor || '#222222';
      document.getElementById('choiceX').value = ch.x ?? 50;
      document.getElementById('choiceY').value = ch.y ?? 20;
      document.getElementById('choiceXVal').textContent = (ch.x ?? 50) + '%';
      document.getElementById('choiceYVal').textContent = (ch.y ?? 20) + '%';
      sel.value = ch.targetId || 'new';
    }
  } else {
    document.getElementById('choiceLabel').value = editingChoiceKind === 'next' ? '➡ Далее' : '';
    document.getElementById('choiceBg').value = '#ffffff';
    document.getElementById('choiceText').value = '#1a1a1a';
    document.getElementById('choiceBorder').value = '#222222';
    document.getElementById('choiceX').value = 50;
    document.getElementById('choiceY').value = editingChoiceKind === 'next' ? 12 : 20;
    document.getElementById('choiceXVal').textContent = '50%';
    document.getElementById('choiceYVal').textContent = (editingChoiceKind === 'next' ? 12 : 20) + '%';
    sel.value = 'new';
  }
}

function saveChoice() {
  if (!currentScene) return;
  const label = document.getElementById('choiceLabel').value.trim();
  if (!label) { alert('Введите надпись'); return; }
  const targetVal = document.getElementById('choiceTarget').value;
  let targetId = null;
  if (targetVal === 'new') {
    const ns = newScene(currentScene.id);
    targetId = ns.id;
  } else targetId = targetVal;

  const data = {
    label,
    bg: document.getElementById('choiceBg').value,
    textColor: document.getElementById('choiceText').value,
    borderColor: document.getElementById('choiceBorder').value,
    x: parseInt(document.getElementById('choiceX').value),
    y: parseInt(document.getElementById('choiceY').value),
    targetId,
  };

  if (editingChoiceId) {
    const ch = currentScene.choices.find(c => c.id === editingChoiceId);
    if (ch) Object.assign(ch, data);
  } else {
    currentScene.choices.push({ id: uid(), ...data });
  }
  closeModal('choiceModal');
  renderChoices();
  save();
}

function deleteEditingChoice() {
  if (!currentScene || !editingChoiceId) return;
  if (!confirm('Удалить кнопку?')) return;
  currentScene.choices = currentScene.choices.filter(c => c.id !== editingChoiceId);
  editingChoiceId = null;
  closeModal('choiceModal');
  renderChoices();
  save();
}

/* ============================================================
   ЭФФЕКТЫ
   ============================================================ */
function openEffectModal() {
  if (!currentScene) return;
  document.getElementById('effectType').value = currentScene.effect.type || 'none';
  document.getElementById('effectDur').value = currentScene.effect.dur || 3;
  document.getElementById('effectModal').classList.remove('hidden');
}

function saveEffect() {
  if (!currentScene) return;
  currentScene.effect.type = document.getElementById('effectType').value;
  currentScene.effect.dur = parseInt(document.getElementById('effectDur').value) || 3;
  closeModal('effectModal');
  applyEffect();
  save();
}

function applyEffect() {
  const el = document.getElementById('effectLayer');
  if (!currentScene) return;
  el.className = '';
  el.style.animation = '';
  el.style.removeProperty('--dur');
  const eff = currentScene.effect;
  if (eff.type === 'fade-dark') {
    el.style.setProperty('--dur', eff.dur + 's');
    el.classList.add('fade-dark');
  } else if (eff.type === 'blink') {
    el.style.setProperty('--dur', eff.dur + 's');
    el.classList.add('blink');
  }
}

/* ============================================================
   ПРОИГРЫВАНИЕ
   ============================================================ */
function startPlaying() {
  if (!currentScene || playing) return;
  if (currentScene.phrases.length === 0) { alert('Добавьте хотя бы одну фразу'); return; }
  playing = true;
  const phone = document.getElementById('phone');
  phone.classList.add('playing');
  playTimers = [];

  const layer = document.getElementById('phrasesLayer');
  layer.innerHTML = '';

  let idx = 0;
  const total = currentScene.phrases.length;

  function showNext() {
    if (!playing) return;
    if (idx >= total) return;
    const ph = currentScene.phrases[idx];
    const div = document.createElement('div');
    div.className = 'phrase';
    div.textContent = ph.text;
    div.style.color = ph.color || '#1a1a1a';
    layer.appendChild(div);

    // пересчёт слотов (только 2 видимых), у каждой фразы свои размеры и шрифты
    const all = Array.from(layer.querySelectorAll('.phrase'));
    all.forEach((el, i) => {
      el.classList.remove('slot-0', 'slot-1', 'slot-2');
      const fromEnd = all.length - 1 - i;
      const srcPh = currentScene.phrases[idx - (all.length - 1 - i)];
      if (!srcPh) return;
      if (fromEnd === 0) {
        el.classList.add('slot-0');
        el.style.fontSize = (srcPh.sizeFront || 22) + 'px';
        el.style.fontFamily = srcPh.fontFront || 'system-ui, sans-serif';
      } else if (fromEnd === 1) {
        el.classList.add('slot-1');
        el.style.fontSize = (srcPh.sizeBack || 16) + 'px';
        el.style.fontFamily = srcPh.fontBack || 'system-ui, sans-serif';
      } else {
        el.classList.add('slot-2');
        el.style.fontSize = (srcPh.sizeBack || 16) + 'px';
        el.style.fontFamily = srcPh.fontBack || 'system-ui, sans-serif';
      }
    });
    all.forEach(el => {
      if (el.classList.contains('slot-2')) setTimeout(() => el.remove(), 750);
    });

    if (ph.audio) {
      const audio = new Audio(ph.audio);
      audio.play().catch(() => {});
    }

    idx++;
    const dur = (ph.dur && ph.dur > 0) ? ph.dur * 1000 : 2200;
    if (idx < total) {
      playTimers.push(setTimeout(showNext, dur));
    }
  }

  applyEffect();
  showNext();
}

function stopPlaying() {
  playing = false;
  playTimers.forEach(t => clearTimeout(t));
  playTimers = [];
  document.getElementById('phone').classList.remove('playing');
  if (currentScene) {
    renderPhrases();
    renderChoices();
    renderBgDesc();
    applyEffect();
  }
}

/* ============================================================
   СПИСОК ВСЕХ КНОПОК
   ============================================================ */
function openAllButtonsModal() {
  if (!currentScene) return;
  const list = document.getElementById('allButtonsList');
  list.innerHTML = '';
  if (currentScene.choices.length === 0) {

  }

    const row = document.createElement('div');

    row.innerHTML = `
      <div style="width:16px;height:16px;border-radius:4px;background:${ch.bg || '#fff'};border:1px solid ${ch.borderColor || '#222'};flex-shrink:0;"></div>
      <div style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(ch.label)} <span style="color:#888;font-size:10px;">(${ch.x ?? 50}%, ${ch.y ?? 20}%)</span></div>
      <button data-id="${ch.id}" data-act="edit" style="background:#3a3a44;color:#fff;border:none;border-radius:4px;padding:4px 7px;font-size:10px;">✏️</button>
      <button data-id="${ch.id}" data-act="del" style="background:#6a3030;color:#fff;border:none;border-radius:4px;padding:4px 7px;font-size:10px;">🗑</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.act === 'edit') { closeModal('allButtonsModal'); openChoiceModal(b.dataset.id); }
      if (b.dataset.act === 'del') {

      }

/* ============================================================
   ТЕКСТЫ
   ============================================================ */
function openTextsModal() {
  if (!currentScene) return;
  const list = document.getElementById('textsList');
  list.innerHTML = '';
  if (currentScene.phrases.length === 0) {
    list.innerHTML = '<p style="color:#666;font-size:11px;">Нет фраз</p>';
  }
  currentScene.phrases.forEach(ph => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:5px;align-items:center;margin-bottom:5px;background:#1a1a22;padding:5px;border-radius:5px;';
    row.innerHTML = `
      <div style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(ph.text)} ${ph.audio ? '🎙' : ''}</div>
      <button data-id="${ph.id}" data-act="edit" style="background:#3a3a44;color:#fff;border:none;border-radius:4px;padding:4px 7px;font-size:10px;">✏️</button>
      <button data-id="${ph.id}" data-act="del" style="background:#6a3030;color:#fff;border:none;border-radius:4px;padding:4px 7px;font-size:10px;">🗑</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.act === 'edit') { closeModal('textsModal'); openPhraseModal(b.dataset.id); }
      if (b.dataset.act === 'del') {
        currentScene.phrases = currentScene.phrases.filter(p => p.id !== b.dataset.id);
        save(); renderPhrases(); openTextsModal();
      }
    };
  });
  document.getElementById('textsModal').classList.remove('hidden');
}

let editingPhraseId = null;

function openPhraseModal(editId) {
  if (!currentScene) return;
  editingPhraseId = editId || null;
  document.getElementById('phraseModal').classList.remove('hidden');
  document.getElementById('audioStatus').textContent = '';
  window._pendingAudio = null;
  if (editId) {
    const ph = currentScene.phrases.find(p => p.id === editId);
    if (ph) {
      document.getElementById('phraseText').value = ph.text;
      document.getElementById('phraseColor').value = ph.color || '#1a1a1a';
      document.getElementById('phraseSizeFront').value = ph.sizeFront || 22;
      document.getElementById('phraseFontFront').value = ph.fontFront || 'system-ui, sans-serif';
      document.getElementById('phraseSizeBack').value = ph.sizeBack || 16;
      document.getElementById('phraseFontBack').value = ph.fontBack || 'system-ui, sans-serif';
      document.getElementById('phraseDur').value = ph.dur || 0;
      document.getElementById('audioStatus').textContent = ph.audio ? '✅ Аудио прикреплено' : '';
    }
  } else {
    document.getElementById('phraseText').value = '';
    document.getElementById('phraseColor').value = '#1a1a1a';
    document.getElementById('phraseSizeFront').value = 22;
    document.getElementById('phraseFontFront').value = 'system-ui, sans-serif';
    document.getElementById('phraseSizeBack').value = 16;
    document.getElementById('phraseFontBack').value = 'system-ui, sans-serif';
    document.getElementById('phraseDur').value = 0;
  }
}

function savePhrase() {
  if (!currentScene) return;
  const text = document.getElementById('phraseText').value.trim();
  if (!text) { alert('Введите текст'); return; }
  const data = {
    id: editingPhraseId || uid(),
    text,
    color: document.getElementById('phraseColor').value,
    sizeFront: parseInt(document.getElementById('phraseSizeFront').value) || 22,
    fontFront: document.getElementById('phraseFontFront').value,
    sizeBack: parseInt(document.getElementById('phraseSizeBack').value) || 16,
    fontBack: document.getElementById('phraseFontBack').value,
    dur: parseInt(document.getElementById('phraseDur').value) || 0,
    audio: null,
  };
  if (editingPhraseId) {
    const idx = currentScene.phrases.findIndex(p => p.id === editingPhraseId);
    if (idx >= 0) {
      data.audio = currentScene.phrases[idx].audio;
      currentScene.phrases[idx] = data;
    }
  } else {
    if (window._pendingAudio) data.audio = window._pendingAudio;
    currentScene.phrases.push(data);
  }
  closeModal('phraseModal');
  renderPhrases();
  save();
}

/* ============================================================
   АУДИО
   ============================================================ */
let mediaRecorder = null;
let recordedChunks = [];

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => {
        if (editingPhraseId) {
          const ph = currentScene.phrases.find(p => p.id === editingPhraseId);
          if (ph) { ph.audio = reader.result; save(); }
        } else {
          window._pendingAudio = reader.result;
        }
        document.getElementById('audioStatus').textContent = '✅ Аудио записано';
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    document.getElementById('btnRecAudio').classList.add('hidden');
    document.getElementById('btnStopRec').classList.remove('hidden');
    document.getElementById('audioStatus').textContent = '🔴 Запись...';
  } catch(e) { alert('Нет доступа к микрофону: ' + e.message); }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  document.getElementById('btnRecAudio').classList.remove('hidden');
  document.getElementById('btnStopRec').classList.add('hidden');
}

function loadAudioFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    if (editingPhraseId) {
      const ph = currentScene.phrases.find(p => p.id === editingPhraseId);
      if (ph) { ph.audio = reader.result; save(); }
    } else {
      window._pendingAudio = reader.result;
    }
    document.getElementById('audioStatus').textContent = '✅ Аудио загружено';
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   ЭКСПОРТ / ИМПОРТ
   ============================================================ */
function exportAll() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'game_draft_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importAll(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.scenes) {
        state.scenes = d.scenes;
        state.currentId = d.currentId;
        save();
        renderSceneList();
        alert('Импортировано сцен: ' + d.scenes.length);
      }
    } catch(err) { alert('Ошибка импорта: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ============================================================
   ТУЛБАР
   ============================================================ */
function updateToolUI() {
  document.querySelectorAll('.tool').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === currentTool);
  });
  applyStrokeStyle();
}
document.querySelectorAll('.tool').forEach(b => {
  b.onclick = () => { currentTool = b.dataset.tool; updateToolUI(); };
});
document.getElementById('colorPick').oninput = applyStrokeStyle;
document.getElementById('sizePick').onchange = applyStrokeStyle;

document.getElementById('btnUndo').onclick = () => {
  if (drawHistory.length > 1) {
    drawHistory.pop();
    restoreFromHistory();
    setTimeout(() => {
      if (currentScene) { currentScene.drawing = drawCv.toDataURL(); save(); }
    }, 60);
  }
};

document.getElementById('btnClearDraw').onclick = () => {
  if (!currentScene) return;
  if (!confirm('Очистить рисунок?')) return;
  const w = drawCv.width / (window.devicePixelRatio || 1);
  const h = drawCv.height / (window.devicePixelRatio || 1);
  ctxDraw.clearRect(0, 0, w, h);
  currentScene.drawing = null;
  pushHistory();
  save();
};

document.getElementById('btnImageBg').onclick = () => {
  if (!currentScene) return;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      currentScene.bgImage = reader.result;
      renderSceneBackground();
      save();
    };
    reader.readAsDataURL(file);
  };
  input.click();
};

document.getElementById('btnBackHome').onclick = () => {
  if (currentScene) { currentScene.drawing = drawCv.toDataURL(); save(); }
  stopPlaying();
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('drawToolbar').classList.add('hidden');
  document.getElementById('bottomBar').classList.add('hidden');
  document.getElementById('canvasWrap').classList.add('hidden');
  renderSceneList();
};

/* ============================================================
   НИЖНЯЯ ПАНЕЛЬ
   ============================================================ */
document.getElementById('btnAddPhrase').onclick = () => openPhraseModal(null);
document.getElementById('btnAddChoice').onclick = () => openChoiceModal(null, 'choice');
document.getElementById('btnAddNext').onclick = () => openChoiceModal(null, 'next');
document.getElementById('btnEffects').onclick = openEffectModal;
document.getElementById('btnBgDesc').onclick = openBgDescModal;
document.getElementById('btnTexts').onclick = openTextsModal;
document.getElementById('btnAllButtons').onclick = openAllButtonsModal;
document.getElementById('btnSave').onclick = () => {
  if (currentScene) { currentScene.drawing = drawCv.toDataURL(); save(); }
  alert('Сохранено в браузере.');
};

/* ============================================================
   МОДАЛКИ
   ============================================================ */
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

document.getElementById('btnRecAudio').onclick = startRecording;
document.getElementById('btnStopRec').onclick = stopRecording;
document.getElementById('btnLoadAudio').onclick = () => document.getElementById('audioFile').click();
document.getElementById('audioFile').onchange = loadAudioFile;

document.getElementById('choiceX').oninput = e => {
  document.getElementById('choiceXVal').textContent = e.target.value + '%';
};
document.getElementById('choiceY').oninput = e => {
  document.getElementById('choiceYVal').textContent = e.target.value + '%';
};

/* ============================================================
   РИСОВАНИЕ: СОБЫТИЯ
   ============================================================ */
drawCv.addEventListener('mousedown', startDraw);
drawCv.addEventListener('mousemove', moveDraw);
drawCv.addEventListener('mouseup', endDraw);
drawCv.addEventListener('mouseleave', endDraw);
drawCv.addEventListener('touchstart', startDraw, { passive: false });
drawCv.addEventListener('touchmove', moveDraw, { passive: false });
drawCv.addEventListener('touchend', endDraw);
drawCv.addEventListener('touchcancel', endDraw);

document.getElementById('btnPlayScene').onclick = startPlaying;
document.getElementById('btnStopPlay').onclick = stopPlaying;

/* ============================================================
   СТАРТ
   ============================================================ */
load();
renderSceneList();
document.getElementById('drawToolbar').classList.add('hidden');
document.getElementById('bottomBar').classList.add('hidden');
document.getElementById('canvasWrap').classList.add('hidden');

window.addEventListener('resize', () => {
  if (currentScene && state.currentId && !document.getElementById('canvasWrap').classList.contains('hidden')) {
    const savedId = state.currentId;
    setTimeout(() => openScene(savedId), 120);
  }
});
</script>
</body>
